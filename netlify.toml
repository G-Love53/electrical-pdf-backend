# ConnectQuote-first: root and /quote → instant intake (long-form stays at /index.html)
[build]
  publish = "Netlify"

[[redirects]]
  from = "/"
  to = "/connectquote.html"
  status = 302
  force = true
  query = ":query"

[[redirects]]
  from = "/quote"
  to = "/connectquote.html"
  status = 302
  query = ":query"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
